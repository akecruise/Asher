<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>เข้าสู่ระบบ · ASHER Marketing Intelligence</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../../shared/asher-theme.css">
<style>
  .login-wrap {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .login-card { width: 100%; max-width: 400px; }
  .login-card .panel { padding: 26px; }
  .login-card h1 { font-size: 19px; margin: 0 0 6px; }
  .login-card label { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 6px; }
  .login-card input { width: 100%; margin-bottom: 14px; }
  .login-card .btn { width: 100%; justify-content: center; }
  .login-error {
    display: none;
    margin-bottom: 14px;
    padding: 10px 12px;
    border-radius: var(--radius-sm);
    background: rgba(239, 68, 68, 0.12);
    border: 1px solid var(--bad);
    color: #ffd9d9;
    font-size: 13px;
  }
  .login-error.show { display: block; }
</style>
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <div class="panel">
      <div class="eyebrow">ASHER MARKETING INTELLIGENCE</div>
      <h1>เข้าสู่ระบบ</h1>
      <p class="faint" style="margin: 0 0 18px;">ระบบนี้เก็บข้อมูลราคาและข้อมูลคู่แข่ง จึงต้องใส่รหัสผ่านก่อนใช้งาน</p>

      <div class="login-error" id="error" role="alert"></div>

      <form id="form" autocomplete="on">
        <div id="emailRow" hidden>
          <label for="email">อีเมล</label>
          <input type="email" id="email" name="email" autocomplete="username" autocapitalize="off" spellcheck="false">
        </div>
        <label for="password">รหัสผ่าน</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required autofocus>
        <button type="submit" class="btn primary" id="submit">เข้าสู่ระบบ</button>
      </form>
    </div>
    <p class="faint" style="text-align: center; margin-top: 14px;">
      ลืมรหัสผ่าน? ดูค่า <span class="mono">ASHER_PASSWORD</span> ที่ตั้งไว้บน host
    </p>
  </div>
</div>
<script src="./app.js"></script>
</body>
</html>
